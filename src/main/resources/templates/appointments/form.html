<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container">
        <h1>Book Appointment</h1>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/appointments}" method="post" class="mt-4" style="max-width:480px;">

            <div class="mb-3">
                <label class="form-label">Customer</label>
                <select name="customerId" class="form-select" required>
                    <option value="" disabled selected>Select a customer</option>
                    <option th:each="customer : ${customers}" th:value="${customer.id}" th:text="${customer.name}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Barber</label>
                <select name="barberId" class="form-select" required>
                    <option value="" disabled selected>Select a barber</option>
                    <option th:each="barber : ${barbers}" th:value="${barber.id}" th:text="${barber.name} + ' (' + ${barber.specialty} + ')'"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Service</label>
                <select name="serviceId" class="form-select" required>
                    <option value="" disabled selected>Select a service</option>
                    <option th:each="service : ${services}" th:value="${service.id}" th:text="${service.name} + ' - $' + ${service.price} + ' (' + ${service.durationMinutes} + ' min)'"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Date &amp; Time</label>
                <input type="datetime-local" name="appointmentDateTime" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary">Book</button>
            <a th:href="@{/appointments}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
