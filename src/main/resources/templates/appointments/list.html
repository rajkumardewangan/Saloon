<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Appointments</h1>
            <a th:href="@{/appointments/new}" class="btn btn-primary">Book Appointment</a>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Date &amp; Time</th>
                    <th>Customer</th>
                    <th>Barber</th>
                    <th>Service</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="appt : ${appointments}">
                    <td th:text="${#temporals.format(appt.appointmentDateTime, 'dd-MMM-yyyy HH:mm')}"></td>
                    <td th:text="${appt.customer.name}"></td>
                    <td th:text="${appt.barber.name}"></td>
                    <td th:text="${appt.service.name}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${appt.status.name() == 'SCHEDULED'} ? 'bg-primary' : (${appt.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-secondary')"
                              th:text="${appt.status}"></span>
                    </td>
                    <td>
                        <form th:action="@{/appointments/{id}/delete(id=${appt.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Cancel this appointment?');">
                            <button type="submit" class="btn btn-sm btn-danger">Cancel</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="6" class="text-center text-muted">No appointments yet.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
