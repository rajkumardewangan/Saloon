<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Customers</h1>
            <a th:href="@{/customers/new}" class="btn btn-primary">Add Customer</a>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="customer : ${customers}">
                    <td th:text="${customer.name}"></td>
                    <td th:text="${customer.phone}"></td>
                    <td th:text="${customer.email}"></td>
                    <td>
                        <a th:href="@{/customers/{id}/edit(id=${customer.id})}" class="btn btn-sm btn-secondary">Edit</a>
                        <form th:action="@{/customers/{id}/delete(id=${customer.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this customer?');">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(customers)}">
                    <td colspan="4" class="text-center text-muted">No customers yet.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
