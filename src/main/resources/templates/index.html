<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Men's Salon - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container">
        <h1 class="mb-4">Welcome to Men's Salon</h1>
        <div class="row g-4">
            <div class="col-md-3">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Customers</h5>
                        <p class="display-6" th:text="${customerCount}">0</p>
                        <a th:href="@{/customers}" class="btn btn-outline-dark btn-sm">Manage</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Barbers</h5>
                        <p class="display-6" th:text="${barberCount}">0</p>
                        <a th:href="@{/barbers}" class="btn btn-outline-dark btn-sm">Manage</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Services</h5>
                        <p class="display-6" th:text="${serviceCount}">0</p>
                        <a th:href="@{/services}" class="btn btn-outline-dark btn-sm">Manage</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Appointments</h5>
                        <p class="display-6" th:text="${appointmentCount}">0</p>
                        <a th:href="@{/appointments}" class="btn btn-outline-dark btn-sm">Manage</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <a th:href="@{/appointments/new}" class="btn btn-primary btn-lg">Book New Appointment</a>
        </div>
    </div>
</body>
</html>
