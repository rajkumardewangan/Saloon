<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Barber Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container">
        <h1 th:text="${barber.id} != null ? 'Edit Barber' : 'Add Barber'"></h1>

        <form th:action="@{/barbers}" th:object="${barber}" method="post" class="mt-4" style="max-width:480px;">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control">
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Specialty</label>
                <input type="text" th:field="*{specialty}" class="form-control" placeholder="e.g. Fades, Beard Styling">
                <div class="text-danger" th:if="${#fields.hasErrors('specialty')}" th:errors="*{specialty}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" th:field="*{phone}" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/barbers}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
