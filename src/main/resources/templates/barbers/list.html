<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Barbers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Barbers</h1>
            <a th:href="@{/barbers/new}" class="btn btn-primary">Add Barber</a>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Specialty</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="barber : ${barbers}">
                    <td th:text="${barber.name}"></td>
                    <td th:text="${barber.specialty}"></td>
                    <td th:text="${barber.phone}"></td>
                    <td>
                        <a th:href="@{/barbers/{id}/edit(id=${barber.id})}" class="btn btn-sm btn-secondary">Edit</a>
                        <form th:action="@{/barbers/{id}/delete(id=${barber.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this barber?');">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(barbers)}">
                    <td colspan="4" class="text-center text-muted">No barbers yet.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
