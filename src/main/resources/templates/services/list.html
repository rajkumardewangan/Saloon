<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Services</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Services</h1>
            <a th:href="@{/services/new}" class="btn btn-primary">Add Service</a>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Duration (min)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="service : ${services}">
                    <td th:text="${service.name}"></td>
                    <td th:text="${service.description}"></td>
                    <td th:text="${'$' + service.price}"></td>
                    <td th:text="${service.durationMinutes}"></td>
                    <td>
                        <a th:href="@{/services/{id}/edit(id=${service.id})}" class="btn btn-sm btn-secondary">Edit</a>
                        <form th:action="@{/services/{id}/delete(id=${service.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this service?');">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(services)}">
                    <td colspan="5" class="text-center text-muted">No services yet.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
